<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxy pool</title>
<link rel="stylesheet" href="style.css">
<!-- guard.js first, then the bridge, then app.js: each depends on the one
     before it. guard.js must precede the bridge because it has to register
     its error listener first to be able to filter them (see the file). Scripts
     have to be files: the page's policy allows no inline script and no
     network. -->
<script src="guard.js"></script>
<script src="_magpie/bridge.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<h1>代理池</h1>
<p class="sub">OpenCode Zen Free 的出口 IP 来自这里。改完点保存，插件会重新加载并使用新的配置。</p>

<div id="notice"></div>

<form id="form" autocomplete="off"></form>

<div class="bar">
  <button type="button" id="save" class="primary">保存</button>
  <button type="button" id="revert">放弃修改</button>
  <span class="status" id="status"></span>
</div>
</body>
</html>
